name: 💡 Feature Request
description: Suggest an enhancement or new feature for the repository
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 💡 Feature Request
        
        Have an idea to improve the Cat Photo App repository? We'd love to hear it!
        
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem?
      placeholder: "I'm always frustrated when..."
      
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution or feature
      placeholder: "I think it would be helpful if..."
    validations:
      required: true
      
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions?
      placeholder: "Another way could be..."
      
  - type: dropdown
    id: feature-type
    attributes:
      label: What type of feature is this?
      options:
        - Documentation improvement
        - New tutorial section
        - Bot enhancement
        - Repository structure
        - Other
    validations:
      required: true
      
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or examples

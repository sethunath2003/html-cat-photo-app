name: Setup Repository Labels

on:
  workflow_dispatch:  # Allows manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/workflows/setup-labels.yml'

jobs:
  setup-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      
    steps:
      - name: Create/Update Labels
        uses: actions/github-script@v7
        with:
          script: |
            // Define labels needed for the repository
            const labels = [
              {
                name: 'contribution',
                color: '0E8A16',
                description: 'Cat Photo App submission from community'
              },
              {
                name: 'ready-for-review',
                color: '1D76DB',
                description: 'Submission passed validation and ready for moderator review'
              },
              {
                name: 'needs-changes',
                color: 'D93F0B',
                description: 'Changes requested before approval'
              },
              {
                name: 'approved',
                color: '0E8A16',
                description: 'Approved and ready to merge'
              },
              {
                name: 'question',
                color: 'D876E3',
                description: 'Questions about the tutorial or contribution process'
              },
              {
                name: 'bug',
                color: 'D73A4A',
                description: 'Something is not working correctly'
              },
              {
                name: 'enhancement',
                color: 'A2EEEF',
                description: 'New feature or improvement suggestion'
              },
              {
                name: 'documentation',
                color: '0075CA',
                description: 'Documentation related changes'
              },
              {
                name: 'good first issue',
                color: '7057FF',
                description: 'Good for newcomers'
              },
              {
                name: 'help wanted',
                color: '008672',
                description: 'Extra attention is needed'
              }
            ];
            
            for (const label of labels) {
              try {
                // Try to update the label
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
                console.log(`✓ Updated label: ${label.name}`);
              } catch (error) {
                // If it doesn't exist, create it
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                  console.log(`✓ Created label: ${label.name}`);
                } else {
                  console.error(`✗ Error with label ${label.name}:`, error.message);
                }
              }
            }
            
            console.log('\n✅ All labels configured successfully!');

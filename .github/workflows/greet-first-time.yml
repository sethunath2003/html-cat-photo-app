name: Greet First-Time Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  greet:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      
    steps:
      - name: Greet First-Time Issue Creator
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            // Check if this is the user's first issue
            const creator = context.payload.issue.user.login;
            
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: creator,
              state: 'all'
            });
            
            if (issues.data.length === 1) {
              const message = `👋 Welcome @${creator}!
              
              Thank you for opening your first issue in the Cat Photo App repository! 
              
              ### What happens next?
              
              - A maintainer will review your issue
              - You may be asked for additional information
              - We'll do our best to help!
              
              ### While you wait
              
              - Check out our [tutorial](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/TUTORIAL.md)
              - Review the [contribution guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md)
              - Explore existing submissions in the \`submissions/\` folder
              
              We're excited to have you here! 🎉`;
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message
              });
            }
